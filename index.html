<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>AETHER V2.0</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07090d;
    color:#edf2f7;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
                 "Segoe UI",sans-serif;
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
    color:inherit;
    cursor:pointer;
}

.app{
    width:100%;
    height:100%;
    position:relative;
}

/* =========================================================
   START
========================================================= */

.start{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:
        max(28px,env(safe-area-inset-top))
        22px
        max(24px,env(safe-area-inset-bottom));
    background:
        radial-gradient(circle at 50% 10%,rgba(77,135,255,.12),transparent 34%),
        #07090d;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    margin-top:12px;
}

.aether-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#78a9ff;
    box-shadow:
        0 0 14px #78a9ff,
        0 0 35px rgba(120,169,255,.35);
}

.brand-name{
    font-weight:700;
    letter-spacing:.18em;
    font-size:13px;
}

.hero{
    margin:auto 0;
}

.hero h1{
    font-size:38px;
    line-height:1.04;
    letter-spacing:-.04em;
    margin:0 0 14px;
    max-width:430px;
}

.hero p{
    color:#8d98a8;
    font-size:16px;
    line-height:1.55;
    max-width:470px;
    margin:0;
}

.prompt{
    width:100%;
    min-height:170px;
    resize:none;
    border:1px solid #202733;
    border-radius:22px;
    background:#0d1118;
    color:#eef3f9;
    padding:18px;
    outline:none;
    line-height:1.5;
    font-size:16px;
    box-shadow:0 12px 50px rgba(0,0,0,.2);
}

.prompt:focus{
    border-color:#4c72aa;
}

.quick{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin:10px 0 12px;
    scrollbar-width:none;
}

.quick::-webkit-scrollbar{
    display:none;
}

.quick button{
    flex:none;
    padding:10px 13px;
    border-radius:999px;
    background:#111722;
    color:#aeb9c9;
    border:1px solid #202938;
    font-size:13px;
}

.preview-btn{
    width:100%;
    min-height:56px;
    border-radius:18px;
    background:#edf3ff;
    color:#080b10;
    font-weight:800;
    letter-spacing:.03em;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    background:#080b10;
}

.workspace.active{
    display:flex;
}

.topbar{
    flex:none;
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:
        max(8px,env(safe-area-inset-top))
        14px 8px;
    border-bottom:1px solid #171d27;
    background:rgba(8,11,16,.92);
    backdrop-filter:blur(18px);
}

.top-left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.back{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#121720;
    color:#aeb9c8;
    font-size:20px;
}

.project-title{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:14px;
    font-weight:700;
}

.state{
    font-size:10px;
    letter-spacing:.12em;
    color:#8da7ce;
    margin-top:2px;
}

.apply-top{
    padding:10px 14px;
    border-radius:12px;
    background:#dfeaff;
    color:#080b10;
    font-size:12px;
    font-weight:800;
}

.surface{
    flex:1;
    overflow:auto;
    padding:18px 14px 110px;
}

/* =========================================================
   GENERIC RENDERER
========================================================= */

.surface-shell{
    max-width:900px;
    margin:0 auto;
}

.generated-header{
    margin:5px 2px 20px;
}

.generated-header h2{
    margin:0;
    font-size:28px;
    letter-spacing:-.035em;
}

.generated-header p{
    color:#788394;
    margin:6px 0 0;
    font-size:13px;
}

.node{
    position:relative;
    transition:.18s ease;
}

.node.changed{
    outline:1px solid rgba(104,155,255,.65);
    box-shadow:0 0 0 5px rgba(104,155,255,.06);
}

.node.new::after{
    content:"+ NEW";
    position:absolute;
    top:-8px;
    right:8px;
    font-size:9px;
    letter-spacing:.1em;
    padding:4px 7px;
    border-radius:999px;
    background:#18345f;
    color:#a9c9ff;
}

.row{
    display:flex;
    gap:10px;
}

.stack{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.card{
    background:#10151d;
    border:1px solid #1c2531;
    border-radius:18px;
    padding:16px;
}

.stat{
    min-height:100px;
}

.stat-label{
    color:#7d8999;
    font-size:12px;
}

.stat-value{
    margin-top:10px;
    font-size:27px;
    font-weight:800;
}

.section-title{
    font-size:14px;
    font-weight:750;
    margin:4px 2px 0;
}

.project{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:70px;
}

.project-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#182235;
    display:grid;
    place-items:center;
    color:#94b9ff;
    font-weight:800;
}

.project-main{
    flex:1;
    min-width:0;
}

.project-name{
    font-weight:700;
    font-size:14px;
}

.project-meta{
    color:#7b8797;
    font-size:11px;
    margin-top:5px;
}

.progress{
    height:5px;
    border-radius:99px;
    background:#1c2430;
    overflow:hidden;
    margin-top:9px;
}

.progress i{
    display:block;
    height:100%;
    width:var(--progress);
    background:#79a9ff;
    border-radius:inherit;
}

.action{
    min-height:48px;
    padding:0 15px;
    border-radius:14px;
    background:#dfeaff;
    color:#080b10;
    font-weight:800;
}

.ghost{
    background:#151b24;
    color:#b9c3d0;
}

.nav{
    display:flex;
    gap:7px;
    overflow:auto;
    scrollbar-width:none;
}

.nav::-webkit-scrollbar{
    display:none;
}

.nav button{
    flex:none;
    padding:10px 13px;
    border-radius:12px;
    background:#111720;
    color:#8591a2;
    border:1px solid #1c2531;
}

.nav button.active{
    color:#eaf1ff;
    background:#182337;
    border-color:#30496e;
}

/* =========================================================
   KANBAN
========================================================= */

.kanban{
    display:grid;
    grid-template-columns:repeat(3,minmax(220px,1fr));
    gap:10px;
    overflow-x:auto;
}

.column{
    background:#0e131a;
    border:1px solid #1b2430;
    border-radius:17px;
    padding:12px;
    min-height:280px;
}

.column-title{
    color:#9aa6b6;
    font-size:12px;
    margin-bottom:10px;
}

.task{
    background:#151b23;
    border:1px solid #202a37;
    border-radius:13px;
    padding:13px;
    margin-bottom:8px;
    font-size:13px;
}

/* =========================================================
   CHAT
========================================================= */

.chat{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:82%;
    padding:12px 14px;
    border-radius:17px;
    background:#121821;
    color:#cbd4df;
    line-height:1.45;
    font-size:14px;
}

.message.me{
    align-self:flex-end;
    background:#203252;
    color:#e6efff;
}

.chat-input{
    display:flex;
    gap:8px;
}

.chat-input input{
    flex:1;
    min-width:0;
    background:#111720;
    color:white;
    border:1px solid #202a36;
    border-radius:14px;
    padding:13px;
    outline:none;
}

/* =========================================================
   BANKING
========================================================= */

.balance{
    font-size:36px;
    font-weight:850;
    letter-spacing:-.04em;
    margin-top:8px;
}

.transaction{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:15px 0;
    border-bottom:1px solid #1c2430;
}

.transaction:last-child{
    border-bottom:0;
}

.tx-name{
    font-size:14px;
    font-weight:650;
}

.tx-date{
    color:#707b8b;
    font-size:11px;
    margin-top:4px;
}

.tx-value{
    font-weight:750;
}

/* =========================================================
   BOTTOM
========================================================= */

.bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:
        10px 12px
        max(12px,env(safe-area-inset-bottom));
    display:flex;
    gap:8px;
    background:linear-gradient(
        transparent,
        rgba(8,11,16,.97) 30%
    );
    pointer-events:none;
}

.bottom>*{
    pointer-events:auto;
}

.bottom button{
    min-height:50px;
    flex:1;
    border-radius:15px;
    font-weight:750;
}

.reject{
    background:#141a22;
    color:#aab4c2;
}

.apply{
    background:#dfeaff;
    color:#080b10;
}

.change-count{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:-27px;
    white-space:nowrap;
    padding:5px 9px;
    border-radius:999px;
    background:#111822;
    border:1px solid #222d3b;
    color:#8996a8;
    font-size:10px;
}

/* =========================================================
   SHEET
========================================================= */

.sheet-backdrop{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.52);
    display:none;
    align-items:flex-end;
    z-index:20;
}

.sheet-backdrop.open{
    display:flex;
}

.sheet{
    width:100%;
    background:#0d1219;
    border-top:1px solid #26303d;
    border-radius:25px 25px 0 0;
    padding:
        10px 14px
        max(18px,env(safe-area-inset-bottom));
    box-shadow:0 -25px 80px rgba(0,0,0,.5);
    animation:up .2s ease;
}

@keyframes up{
    from{transform:translateY(30px);opacity:.5}
    to{transform:none;opacity:1}
}

.handle{
    width:42px;
    height:4px;
    border-radius:99px;
    background:#303946;
    margin:3px auto 14px;
}

.sheet-title{
    font-size:15px;
    font-weight:800;
    margin-bottom:10px;
}

.sheet-sub{
    color:#788595;
    font-size:12px;
    margin-bottom:13px;
}

.sheet button{
    width:100%;
    text-align:left;
    min-height:51px;
    margin-bottom:7px;
    border-radius:14px;
    background:#141a22;
    color:#d8e0ea;
    padding:0 15px;
}

.sheet button:last-child{
    margin-bottom:0;
    background:transparent;
    color:#727e8d;
}

/* =========================================================
   DIALOG
========================================================= */

.dialog-backdrop{
    position:absolute;
    inset:0;
    z-index:30;
    background:rgba(0,0,0,.62);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.dialog-backdrop.open{
    display:flex;
}

.dialog{
    width:min(500px,100%);
    background:#0e141c;
    border:1px solid #252f3c;
    border-radius:22px;
    padding:18px;
    box-shadow:0 25px 90px rgba(0,0,0,.6);
}

.dialog h3{
    margin:0 0 7px;
    font-size:17px;
}

.dialog p{
    color:#818d9c;
    font-size:12px;
    line-height:1.5;
    margin:0 0 14px;
}

.dialog textarea{
    width:100%;
    min-height:120px;
    resize:none;
    background:#090d13;
    color:#edf2f8;
    border:1px solid #242e3b;
    border-radius:15px;
    padding:13px;
    outline:none;
}

.dialog-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.dialog-actions button{
    flex:1;
    min-height:48px;
    border-radius:14px;
    background:#161d26;
}

.dialog-actions .primary{
    background:#dfeaff;
    color:#080b10;
    font-weight:800;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:absolute;
    z-index:50;
    left:50%;
    top:calc(max(10px,env(safe-area-inset-top)) + 65px);
    transform:translateX(-50%) translateY(-15px);
    opacity:0;
    pointer-events:none;
    padding:9px 13px;
    border-radius:999px;
    background:#171e28;
    border:1px solid #293443;
    color:#b9c5d4;
    font-size:11px;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(min-width:760px){
    .grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .surface{
        padding-left:28px;
        padding-right:28px;
    }

    .start{
        padding-left:10%;
        padding-right:10%;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ======================================================
     START
======================================================= -->

<section class="start" id="start">

    <div class="brand">

    </div>

Baue eine Projektverwaltung mit Projekten links und Aufgaben rechts..."

    <header class="topbar">

        <div class="top-left">

            <button class="back" id="backBtn">‹</button>

            <div>
                <div class="project-title" id="projectTitle">

                </div>

                </div>
            </div>

            ANWENDEN
        </button>

    </header>

        </div>

        </button>

        <button class="apply" id="applyBtn">
            ANWENDEN
        </button>

<!-- ======================================================
     CONTEXT SHEET
======================================================= -->

<div class="sheet-backdrop" id="sheetBackdrop">

    <div class="sheet">

        <div class="handle"></div>

        <div class="sheet-title" id="sheetTitle">
            Element
        </div>

        <div class="sheet-sub" id="sheetSub">

</div>

</div>


<div class="toast" id="toast"></div>

<script>

/* =========================================================
   AETHER CORE
========================================================= */

/*
    CORE INVARIANT

    liveBlueprint
        = aktuelle Realität

    stagedBlueprint
        = vorgeschlagene nächste Realität

    LLM und User dürfen niemals liveBlueprint
    direkt verändern.

    Beide erzeugen ChangeRequests.

    Nur commit() darf staged → live durchführen.
*/


const AETHER = (() => {

    let liveBlueprint = null;
    let stagedBlueprint = null;

    let selectedNode = null;

    let requestCounter = 0;


    /* -----------------------------------------------------
       UTIL
    ----------------------------------------------------- */

    const clone = obj =>
        JSON.parse(JSON.stringify(obj));

    const id = prefix =>
        prefix + "_" + (++requestCounter);


    /* -----------------------------------------------------
       CHANGE REQUEST
    ----------------------------------------------------- */

    function request(source,operation,target,payload={}){

        return {
            id:id("cr"),
            source,
            operation,
            target,
            payload,
            timestamp:Date.now()
        };

    }


    /* -----------------------------------------------------
       BLUEPRINT FACTORY
    ----------------------------------------------------- */

    function createBase(){

        return {

            meta:{
                name:"AETHER PROJECT",
                version:1
            },

            nodes:{},

            root:[],

            data:{},

            behavior:{},

            bindings:{},

            files:{}

        };

    }


    function addNode(bp,node){

        bp.nodes[node.id] = node;

        if(node.parent){

            if(!bp.nodes[node.parent].children)
                bp.nodes[node.parent].children=[];

            bp.nodes[node.parent].children.push(node.id);

        }else{

            bp.root.push(node.id);

        }

    }


    /* -----------------------------------------------------
       VALIDATOR
    ----------------------------------------------------- */

    function validateBlueprint(bp){

        const errors=[];

        if(!bp || !bp.nodes){

            errors.push("Blueprint fehlt.");

            return errors;

        }

        Object.values(bp.nodes).forEach(node=>{

            if(!node.id)
                errors.push("Node ohne ID.");

            if(!node.type)
                errors.push(node.id+" besitzt keinen Typ.");

            if(node.parent &&
               !bp.nodes[node.parent]){

                errors.push(
                    node.id+
                    ": Parent existiert nicht."
                );

            }

        });

        return errors;

    }


    /* -----------------------------------------------------
       OPERATIONS
    ----------------------------------------------------- */

    function applyOperation(bp,r){

        switch(r.operation){

            case "add_element":{

                addNode(bp,clone(r.payload));

                break;
            }

            case "rename":{

                if(!bp.nodes[r.target])
                    throw new Error("Ziel existiert nicht.");

                bp.nodes[r.target].label =
                    r.payload.label;

                break;
            }

            case "set_property":{

                if(!bp.nodes[r.target])
                    throw new Error("Ziel existiert nicht.");

                bp.nodes[r.target].properties =
                    bp.nodes[r.target].properties || {};

                bp.nodes[r.target]
                    .properties[r.payload.key] =
                    r.payload.value;

                break;
            }

            case "move":{

                if(!bp.nodes[r.target])
                    throw new Error("Ziel existiert nicht.");

                const node=bp.nodes[r.target];

                if(node.parent){

                    const oldParent=
                        bp.nodes[node.parent];

                    oldParent.children =
                        oldParent.children.filter(
                            x=>x!==node.id
                        );

                }else{

                    bp.root=
                        bp.root.filter(
                            x=>x!==node.id
                        );

                }

                node.parent=r.payload.parent;

                if(node.parent){

                    if(!bp.nodes[node.parent])
                        throw new Error("Neuer Parent existiert nicht.");

                    bp.nodes[node.parent].children =
                        bp.nodes[node.parent].children || [];

                    bp.nodes[node.parent]
                        .children.push(node.id);

                }else{

                    bp.root.push(node.id);

                }

                break;
            }

            case "delete":{

                if(!bp.nodes[r.target])
                    throw new Error("Ziel existiert nicht.");

                const node=bp.nodes[r.target];

                if(node.parent){

                    bp.nodes[node.parent].children =
                        bp.nodes[node.parent].children
                            .filter(x=>x!==node.id);

                }else{

                    bp.root=
                        bp.root.filter(
                            x=>x!==node.id
                        );

                }

                delete bp.nodes[r.target];

                break;
            }

            case "bind":{

                bp.bindings[r.target]=
                    r.payload.function;

                break;
            }

            default:

                throw new Error(
                    "Unbekannte Operation: "+
                    r.operation
                );

        }

    }


    /* -----------------------------------------------------
       STAGE
    ----------------------------------------------------- */

    function stage(requests){

        const draft =
            clone(liveBlueprint);

        const results=[];

        for(let i=0;i<requests.length;i++){

            const r=requests[i];

            try{

                applyOperation(draft,r);

                results.push({
                    request:r,
                    valid:true
                });

            }catch(error){

                return {
                    valid:false,
                    errors:[error.message],
                    failedAt:i,
                    results
                };

            }

        }

        const integrity=
            validateBlueprint(draft);

        if(integrity.length){

            return {
                valid:false,
                errors:integrity,
                results
            };

        }

        stagedBlueprint=draft;

        return {
            valid:true,
            blueprint:clone(draft),
            results
        };

    }


    /* -----------------------------------------------------
       DIFF
    ----------------------------------------------------- */

    function diff(){

        if(!liveBlueprint || !stagedBlueprint)
            return [];

        const changes=[];

        const oldNodes=liveBlueprint.nodes;
        const newNodes=stagedBlueprint.nodes;

        Object.keys(newNodes).forEach(key=>{

            if(!oldNodes[key]){

                changes.push({
                    type:"new",
                    id:key
                });

            }else if(
                JSON.stringify(oldNodes[key]) !==
                JSON.stringify(newNodes[key])
            ){

                changes.push({
                    type:"changed",
                    id:key
                });

            }

        });

        Object.keys(oldNodes).forEach(key=>{

            if(!newNodes[key]){

                changes.push({
                    type:"deleted",
                    id:key
                });

            }

        });

        return changes;

    }


    /* -----------------------------------------------------
       COMMIT
    ----------------------------------------------------- */

    function commit(){

        if(!stagedBlueprint)
            return false;

        const errors=
            validateBlueprint(stagedBlueprint);

        if(errors.length)
            return false;

        liveBlueprint =
            clone(stagedBlueprint);

        stagedBlueprint=null;

        return true;

    }


    function reject(){

        stagedBlueprint=null;

    }


    function getCurrent(){

        return stagedBlueprint || liveBlueprint;

    }


    /* -----------------------------------------------------
       PUBLIC
    ----------------------------------------------------- */

    return {

        request,
        stage,
        commit,
        reject,
        diff,
        getCurrent,
        getLive:()=>clone(liveBlueprint),
        getStaged:()=>clone(stagedBlueprint),

        init(bp){

            liveBlueprint=clone(bp);
            stagedBlueprint=null;

        }

    };

})();


window.AETHER=AETHER;

        label,
        parent,
        properties,
        children:[]
    };

}

/* =========================================================
   SIMPLE NATURAL LANGUAGE INFERENCE
========================================================= */

function inferSurface(text){

    const t=text.toLowerCase();

    if(
        t.includes("kanban") ||
        t.includes("aufgaben") ||
        t.includes("spalten")
    )
        return makeKanban();

    if(
        t.includes("chat") ||
        t.includes("nachrichten") ||
        t.includes("assistent")
    )
        return makeChat();

    if(
        t.includes("bank") ||
        t.includes("konto") ||
        t.includes("kontostand")
    )
        return makeBanking();

    return makeDashboard();

}


/* =========================================================
   RENDERER
========================================================= */

const surface=document.getElementById("surface");


function children(bp,id){

    const n=bp.nodes[id];

    return (n.children||[])
        .map(childId=>bp.nodes[childId])
        .filter(Boolean);

}


function renderNode(bp,n){

    const wrapper=document.createElement("div");

    wrapper.className="node";

    wrapper.dataset.id=n.id;


    const changes=AETHER.diff();

    const change=changes.find(c=>c.id===n.id);

    if(change){

        if(change.type==="new")
            wrapper.classList.add("new");

        if(change.type==="changed")
            wrapper.classList.add("changed");

    }


    wrapper.addEventListener(
        "click",
        e=>{
            e.stopPropagation();
            openSheet(n);
        }
    );


    const kids=children(bp,n.id);


    switch(n.type){

        case "page":{

            wrapper.classList.add("surface-shell");

            wrapper.innerHTML=`
                <div class="generated-header">
                    <h2>${escapeHtml(n.label)}</h2>
                    <p>Visuelle Programmvorschau</p>
                </div>
            `;

            kids.forEach(k=>
                wrapper.appendChild(
                    renderNode(bp,k)
                )
            );

            break;

        }


        case "grid":{

            wrapper.classList.add("grid");

            kids.forEach(k=>
                wrapper.appendChild(
                    renderNode(bp,k)
                )
            );

            break;

        }


        case "stat":{

            wrapper.classList.add("card","stat");

            wrapper.innerHTML=`
                <div class="stat-label">
                    ${escapeHtml(n.label)}
                </div>

                <div class="stat-value">
                    ${escapeHtml(
                        n.properties.value || "—"
                    )}
                </div>
            `;

            break;

        }


        case "panel":{

            wrapper.classList.add("card");

            wrapper.innerHTML=`
                <div class="section-title">
                    ${escapeHtml(n.label)}
                </div>
            `;

            kids.forEach(k=>
                wrapper.appendChild(
                    renderNode(bp,k)
                )
            );

            break;

        }


        case "list":{

            wrapper.classList.add("stack");

            kids.forEach(k=>
                wrapper.appendChild(
                    renderNode(bp,k)
                )
            );

            break;

        }


        case "project":{

            wrapper.classList.add("card","project");

            const progress=
                Number(n.properties.progress||0);

            wrapper.innerHTML=`

                <div class="project-icon">
                    ${escapeHtml(
                        n.label.charAt(0)
                    )}
                </div>

                <div class="project-main">

                    <div class="project-name">
                        ${escapeHtml(n.label)}
                    </div>

                    <div class="project-meta">
                        ${escapeHtml(
                            n.properties.status || ""
                        )}
                    </div>

                    <div class="progress">
                        <i style="--progress:${progress}%"></i>
                    </div>

                </div>
            `;

            break;

        }


        case "button":{

            wrapper.innerHTML=`
                <button class="action">
                    ${escapeHtml(n.label)}
                </button>
            `;

            break;

        }


        case "nav":{

            wrapper.classList.add("nav");

            ["Übersicht","Projekte","Aktivität"]
                .forEach((x,i)=>{

                    const b=document.createElement("button");

                    b.textContent=x;

                    if(i===0)
                        b.classList.add("active");

                    wrapper.appendChild(b);

                });

            break;

        }


        case "kanban":{

            wrapper.classList.add("kanban");

            kids.forEach(k=>
                wrapper.appendChild(
                    renderNode(bp,k)
                )
            );

            break;

        }


        case "column":{

            wrapper.classList.add("column");

            wrapper.innerHTML=`
                <div class="column-title">
                    ${escapeHtml(n.label)}
                </div>
            `;

            kids.forEach(k=>
                wrapper.appendChild(
                    renderNode(bp,k)
                )
            );

            break;

        }


        case "task":{

            wrapper.classList.add("task");

            wrapper.textContent=n.label;

            break;

        }


        case "chat":{

            wrapper.classList.add("chat");

            kids.forEach(k=>
                wrapper.appendChild(
                    renderNode(bp,k)
                )
            );

            break;

        }


        case "message":{

            wrapper.classList.add("message");

            if(n.properties.mine)
                wrapper.classList.add("me");

            wrapper.textContent=n.label;

            break;

        }


        case "input":{

            wrapper.innerHTML=`
                <div class="chat-input">
                    <input
                        placeholder="${escapeHtml(n.label)}"
                    >
                    <button class="action">
                        Senden
                    </button>
                </div>
            `;

            break;

        }


        case "card":{

            wrapper.classList.add("card");

            if(n.properties.value){

                wrapper.innerHTML=`
                    <div class="stat-label">
                        ${escapeHtml(n.label)}
                    </div>

                    <div class="balance">
                        ${escapeHtml(n.properties.value)}
                    </div>
                `;

            }else{

                wrapper.innerHTML=
                    `<div class="section-title">
                        ${escapeHtml(n.label)}
                    </div>`;

                kids.forEach(k=>
                    wrapper.appendChild(
                        renderNode(bp,k)
                    )
                );

            }

            break;

        }


        case "transaction":{

            wrapper.classList.add("transaction");

            wrapper.innerHTML=`

                <div>
                    <div class="tx-name">
                        ${escapeHtml(n.label)}
                    </div>

                    <div class="tx-date">
                        ${escapeHtml(
                            n.properties.date || ""
                        )}
                    </div>
                </div>

                <div class="tx-value">
                    ${escapeHtml(
                        n.properties.value || ""
                    )}
                </div>

            `;

            break;

        }


        default:{

            wrapper.classList.add("card");

            wrapper.textContent=n.label;

        }

    }

    return wrapper;

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const bp=AETHER.getCurrent();

    if(!bp)
        return;

    surface.innerHTML="";

    bp.root.forEach(rootId=>{

        const n=bp.nodes[rootId];

        if(n)
            surface.appendChild(
                renderNode(bp,n)
            );

    });

    updateChangeCount();

}

/* =========================================================
   USER → CHANGE REQUEST
========================================================= */

function userChange(text){

    if(!currentSelection)
        return;

    const n=currentSelection;

    /*
        Extremely small demo translator.

        In production:
            USER
              ↓
            CHATGPT
              ↓
            ChangeRequest[]
    */

    const t=text.toLowerCase();

    let r=null;

    if(
        t.includes("name") ||
        t.includes("heiß") ||
        t.includes("umbenennen")
    ){

        const newName=
            text.split(/name|heiß|umbenennen/i)
                .pop()
                .replace(/[:=]/g,"")
                .trim();

        if(newName){

            r=AETHER.request(
                "user",
                "rename",
                n.id,
                {
                    label:newName
                }
            );

        }

    }


    if(!r){

        /*
            Für die Demo wird eine Änderung
            nur dann erzeugt, wenn sie eindeutig
            als Änderung verstanden werden kann.

            Diskussionen bleiben Diskussionen.
        */

        showToast(
            "Als Kontext vorgemerkt — keine Änderung."
        );

        return;

    }


    const result=
        AETHER.stage([r]);

    if(!result.valid){

        showToast(
            "Änderung abgelehnt: "+
            result.errors[0]
        );

        return;

    }

    render();

    showToast(
        "Änderung ist jetzt als Vorschlag vorgemerkt."
    );

}

/* =========================================================
   PREVIEW
========================================================= */

function createPreview(text){

    const base=
        inferSurface(text);

    /*
        Demo:
        base becomes the current live state.
        Then a tiny staged metadata change is created,
        so the preview visibly demonstrates staging.
    */

    AETHER.init(base);

    const r=AETHER.request(
        "llm",
        "set_property",
        base.root[0],
        {
            key:"preview",
            value:true
        }
    );

    const result=AETHER.stage([r]);

    if(!result.valid){

        showToast("Preview konnte nicht erstellt werden.");

        return;

    }

    document.getElementById("projectTitle")
        .textContent=
        base.meta.name;

    document.getElementById("start")
        .style.display="none";

    document.getElementById("workspace")
        .classList.add("active");

    render();

}

/* =========================================================
   APPLY / REJECT
========================================================= */

function apply(){

    if(!AETHER.getStaged()){

        showToast("Keine Änderungen vorhanden.");

        return;

    }

    if(AETHER.commit()){

        showToast(
            "Änderungen übernommen."
        );

        render();

        updateChangeCount();

    }

}


function reject(){

    AETHER.reject();

    document.getElementById("workspace")
        .classList.remove("active");

    document.getElementById("start")
        .style.display="flex";

    updateChangeCount();

}


document.getElementById("applyBtn")
    .onclick=apply;

document.getElementById("applyTop")
    .onclick=apply;

document.getElementById("rejectBtn")
    .onclick=reject;


document.getElementById("backBtn")
    .onclick=()=>{

        if(
            AETHER.getStaged() &&
            AETHER.diff().length
        ){

            if(
                confirm(
                    "Vorschlag verwerfen?"
                )
            )
                reject();

        }else{

            reject();

        }

    };

========================================================= */

function updateChangeCount(){

    const count=
        AETHER.diff().length;

    document.getElementById("changeCount")
        .textContent=
        `${count} Änderung${count===1?"":"en"}`;

}

    );

}
